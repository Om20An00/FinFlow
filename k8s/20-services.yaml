          httpGet: { path: /actuator/health/readiness, port: 8083 }
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: 8083 }
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 6
        resources:
          requests: { cpu: 150m, memory: 384Mi }
          limits: { memory: 768Mi }
