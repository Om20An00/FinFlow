apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: finflow
  labels: { app: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      enableServiceLinks: false
      containers:
      - name: gateway
        image: finflow/gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8080 }]
        readinessProbe:
          httpGet: { path: /actuator/health/readiness, port: 8080 }
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: 8080 }
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 6
        resources:
          requests: { cpu: 150m, memory: 384Mi }
          limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: finflow }
spec:
  selector: { app: gateway }
  ports:
  - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gateway, namespace: finflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: finflow
  labels: { app: user-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata:
      labels: { app: user-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      enableServiceLinks: false
      containers:
      - name: user-service
        image: finflow/user-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8081 }]
        env:
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: db-credentials, key: users } }
        readinessProbe:
          httpGet: { path: /actuator/health/readiness, port: 8081 }
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: 8081 }
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 6
        resources:
          requests: { cpu: 150m, memory: 384Mi }
          limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: finflow }
spec:
  selector: { app: user-service }
  ports:
  - { name: http, port: 8081, targetPort: 8081 }
