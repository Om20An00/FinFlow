# Headless service: DNS returns every wallet pod IP so the gRPC client can round-robin across pods.
apiVersion: v1
kind: Service
metadata: { name: wallet-service-grpc, namespace: finflow }
spec:
  clusterIP: None
  selector: { app: wallet-service }
  ports:
  - { name: grpc, port: 9092, targetPort: 9092 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: wallet-service, namespace: finflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: wallet-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: finflow
  labels: { app: payment-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata:
      labels: { app: payment-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      enableServiceLinks: false
      containers:
      - name: payment-service
        image: finflow/payment-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8083 }]
        env:
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: db-credentials, key: payment } }
