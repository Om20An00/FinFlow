# Demo-grade infrastructure (no persistent volumes). In real life: RDS/Aurora, ElastiCache, MSK, managed Keycloak.
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: finflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      enableServiceLinks: false
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: db-credentials, key: postgres } }
        ports: [{ containerPort: 5432 }]
        volumeMounts: [{ name: init, mountPath: /docker-entrypoint-initdb.d }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "postgres"] }
          periodSeconds: 5
        resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
      volumes:
      - name: init
        configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: finflow }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: finflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      enableServiceLinks: false
      containers:
      - name: redis
        image: redis:7-alpine
        ports: [{ containerPort: 6379 }]
        readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: finflow }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: finflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false   # otherwise K8s injects KAFKA_PORT=tcp://... which breaks the Kafka image
      containers:
      - name: kafka
        image: apache/kafka:3.8.0
        ports: [{ containerPort: 9092 }]
        env:
        - { name: KAFKA_NODE_ID, value: "1" }
        - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
        - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
        - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
        - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
        - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
        - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
        - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
        - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
        - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
        readinessProbe:
          tcpSocket: { port: 9092 }
          initialDelaySeconds: 20
          periodSeconds: 5
        resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: finflow }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak, namespace: finflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      enableServiceLinks: false
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.5
        args: ["start-dev", "--import-realm"]
        env:
        - { name: KEYCLOAK_ADMIN, value: admin }
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
        - { name: KC_HOSTNAME_URL, value: "http://localhost:8180" }
        - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
        - { name: KC_HTTP_ENABLED, value: "true" }
        ports: [{ containerPort: 8080 }]
        volumeMounts: [{ name: realm, mountPath: /opt/keycloak/data/import }]
        readinessProbe:
          httpGet: { path: /realms/finflow, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
        resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
      volumes:
      - name: realm
        configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: finflow }
spec:
  selector: { app: keycloak }
  ports: [{ port: 8080, targetPort: 8080 }]
