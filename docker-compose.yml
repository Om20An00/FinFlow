name: finflow

# One command:  docker compose up --build -d      (or ./start.sh)

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka:    { condition: service_started }
    redis:    { condition: service_healthy }

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  keycloak:
    image: finflow/keycloak:1.0.0
    build:
      context: ./infra/keycloak
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/finflow-realm.json:/opt/keycloak/data/import/finflow-realm.json:ro

  # ------------------------------------------------------------------ microservices
  gateway:
    <<: *service
    image: finflow/gateway:1.0.0
    build:
      context: .
      args:
        MODULE: gateway
        PORT: "8080"
    ports:
      - "8080:8080"
  user-service:
    <<: *service
    image: finflow/user-service:1.0.0
    build:
      context: .
      args:
        MODULE: user-service
        PORT: "8081"
  wallet-service:
    <<: *service
    image: finflow/wallet-service:1.0.0
    build:
      context: .
      args:
        MODULE: wallet-service
        PORT: "8082"
  payment-service:
    <<: *service
    image: finflow/payment-service:1.0.0
    build:
      context: .
      args:
        MODULE: payment-service
        PORT: "8083"
    environment:
      WALLET_GRPC_TARGET: dns:///wallet-service:9092
  notification-service:
    <<: *service
    image: finflow/notification-service:1.0.0
    build:
      context: .
      args:
        MODULE: notification-service
        PORT: "8084"
  audit-service:
    <<: *service
    image: finflow/audit-service:1.0.0
    build:
      context: .
      args:
        MODULE: audit-service
        PORT: "8085"
  analytics-service:
    <<: *service
    image: finflow/analytics-service:1.0.0
    build:
      context: .
      args:
        MODULE: analytics-service
        PORT: "8086"

  # ------------------------------------------------------------------ UI + observability
  ui:
    image: finflow/ui:1.0.0
    build: ./ui
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/finflow.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: finflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka: { condition: service_started }